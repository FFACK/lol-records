[package]
name = "lol-records"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.3"
interprocess = "2"
ed25519-dalek = "2"
semver = "1"
native-windows-gui = { version = "1", default-features = false, features = ["list-view", "notice", "textbox"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Pipes"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
